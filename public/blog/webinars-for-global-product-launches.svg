<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Webinars for global product launches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#0871ab" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Globe mark: one launch, every market. -->
  <g transform="translate(96 130)" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round">
    <circle cx="56" cy="56" r="52" />
    <path d="M4 56 H108" />
    <path d="M56 4 Q22 56 56 108" />
    <path d="M56 4 Q90 56 56 108" />
  </g>
  <text x="96" y="330" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="40" fill="#9fb3c8" font-weight="600">Launches &amp; all-hands</text>
  <text x="96" y="410" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="62" fill="#ffffff" font-weight="800">One webinar,</text>
  <text x="96" y="478" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="62" fill="#ffffff" font-weight="800">every language</text>
  <text x="96" y="540" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#cbd5e1">No regional repeats, no interpreter booths</text>
</svg>
