<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="How to host a multilingual webinar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#0871ab" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Broadcast mark: one source, many listeners. -->
  <g transform="translate(96 140)" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round">
    <circle cx="18" cy="18" r="16" />
    <path d="M52 4 Q74 18 52 32" />
    <path d="M76 -8 Q108 18 76 44" />
  </g>
  <text x="96" y="300" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="40" fill="#9fb3c8" font-weight="600">Webinars</text>
  <text x="96" y="380" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="66" fill="#ffffff" font-weight="800">Host multilingual</text>
  <text x="96" y="452" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="66" fill="#ffffff" font-weight="800">webinars</text>
  <text x="96" y="518" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#cbd5e1">Present once — everyone follows in their own language</text>
</svg>
