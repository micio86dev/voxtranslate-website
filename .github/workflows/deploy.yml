name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so published PocketBase content is picked up even without a hook.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          # Optional override for the Meta pixel (repo Variables → PUBLIC_FB_PIXEL_ID).
          # Unset falls back to the id in src/lib/site.ts; 'off' ships no pixel at all.
          PUBLIC_FB_PIXEL_ID: ${{ vars.PUBLIC_FB_PIXEL_ID }}
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=voxtranslate-website --branch=main
