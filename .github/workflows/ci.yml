name: CI

on:
  pull_request:
    # `develop` is the integration branch (staging); every feature branch is merged
    # there first, so gating only on `main` meant the schema gate and the Lighthouse
    # budget never ran on the PR that actually introduced a regression.
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The publication threshold, re-proved on every PR. Asserts that the content
      # schemas still REJECT thin and unmeasured entries (and still accept complete
      # ones). See docs/seo/AGENTS.md R2/R3.
      - name: Schema gate
        run: pnpm run verify:schemas

      - name: Build
        run: pnpm run build

      - name: Serve dist for Lighthouse
        run: pnpm dlx serve dist -p 4321 &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:4321/en/ --timeout 30000

      # R7: no new page ships below 90 mobile. `lighthouserc.json` turns that from a
      # note in a doc into a failing check, and carries the resource budget with it.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4321/en/
            http://localhost:4321/en/blog/
            http://localhost:4321/live-translation/
            http://localhost:4321/latency/
            http://localhost:4321/languages/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
